
spring.application.name=toll-plaza-finder

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/dbname
spring.datasource.username=root
spring.datasource.password=pass

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cache Configuration
spring.cache.type=caffeine

# Hibernate batch processing
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Maximum distance from driving route to consider a toll plaza
toll-plaza.route-corridor-km=2.0

# Mappls Configuration
mappls.api-key=key
mappls.routing-url=https://route.mappls.com/route/direction